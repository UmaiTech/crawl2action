[project]
name = "crawl2action"
version = "0.1.0"
description = "E2E pipeline: crawl e-commerce catalogs, build datasets, post-train LLMs, benchmark and serve."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
data = ["pyarrow>=15"]
modal = ["modal>=1.0"]
train = ["tinker>=0.23.0", "tinker-cookbook", "torch"]
train-fallback = ["trl", "peft"]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]
eval = ["inspect-ai"]
dev = ["pytest>=8", "ruff>=0.6", "respx>=0.21", "fastapi>=0.115", "httpx>=0.27", "pyarrow>=15"]

[project.scripts]
c2a = "c2a.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/c2a"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
